# This block is required for Nginx to work
events {
    worker_connections 1024;  # Adjust based on the load you expect
}

http {
    include       mime.types;  # Ensure MIME types are included
    default_type  application/octet-stream;  # Fallback MIME type

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Handle React's client-side routing
        location / {
            try_files $uri /index.html;  # Serve index.html for unmatched routes
        }

        # Optional: handle specific errors (e.g., 405 Method Not Allowed)
        error_page  405 =200 $uri;
    }
}
